---
# ── MCP Server Deployment ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: ai-coding-tools
    component: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-coding-tools
      component: mcp-server
  template:
    metadata:
      labels:
        app: ai-coding-tools
        component: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: ai-coding-tools:latest
        command: ["python", "-m", "mcp_server.server", "--transport", "http", "--port", "8000"]
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: "INFO"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          tcpSocket:
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
      restartPolicy: Always

---
# ── Context Dashboard Deployment ──────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-dashboard
  labels:
    app: ai-coding-tools
    component: context-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-coding-tools
      component: context-dashboard
  template:
    metadata:
      labels:
        app: ai-coding-tools
        component: context-dashboard
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: context-dashboard
          image: ghcr.io/your-org/ai-coding-tools:latest
          imagePullPolicy: Always
          command: ["python", "-m", "context_dashboard"]
          ports:
            - name: http
              containerPort: 5003
              protocol: TCP
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5003
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: orchestrator-context
              mountPath: /home/appuser/.ai-orchestrator
            - name: agentic-team-context
              mountPath: /home/appuser/.agentic-team
      volumes:
        - name: orchestrator-context
          persistentVolumeClaim:
            claimName: orchestrator-context-data
        - name: agentic-team-context
          persistentVolumeClaim:
            claimName: agentic-team-context-data
      restartPolicy: Always
