# ──────────────────────────────────────────────────────────────────────────────
# Kubernetes Deployments — AI Coding Tools
#
# Two independent Deployments:
#   ai-orchestrator   → runs orchestrator/ui/app.py   on port 5001
#   agentic-team      → runs agentic_team/ui/app.py   on port 5002
#
# Both use HTTP probes against /health and /ready.
# ──────────────────────────────────────────────────────────────────────────────

# ── Orchestrator Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
  labels:
    app: ai-orchestrator
    component: orchestrator-ui
    version: v2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-orchestrator
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ai-orchestrator
        component: orchestrator-ui
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: orchestrator-ui
          image: ghcr.io/your-org/ai-coding-tools:latest
          imagePullPolicy: Always
          # Runs orchestrator/ui/app.py (the Dockerfile default CMD)
          command: ["python", "orchestrator/ui/app.py"]

          ports:
            - name: http
              containerPort: 5001
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP

          env:
            - name: APP_ENV
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PORT
              value: "5001"
            - name: ENABLE_METRICS
              value: "true"
            - name: METRICS_PORT
              value: "9090"

          envFrom:
            - configMapRef:
                name: ai-orchestrator-config
            - secretRef:
                name: ai-orchestrator-secrets

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          volumeMounts:
            - name: orchestrator-config
              mountPath: /app/orchestrator/config
              readOnly: true
            - name: output
              mountPath: /app/output
            - name: workspace
              mountPath: /app/workspace
            - name: logs
              mountPath: /app/logs
            - name: orchestrator-context
              mountPath: /home/appuser/.ai-orchestrator

      volumes:
        - name: orchestrator-config
          configMap:
            name: ai-orchestrator-config-file
        - name: output
          persistentVolumeClaim:
            claimName: ai-orchestrator-output
        - name: workspace
          persistentVolumeClaim:
            claimName: ai-orchestrator-workspace
        - name: logs
          persistentVolumeClaim:
            claimName: ai-orchestrator-logs
        - name: orchestrator-context
          persistentVolumeClaim:
            claimName: orchestrator-context-data

      restartPolicy: Always

---
